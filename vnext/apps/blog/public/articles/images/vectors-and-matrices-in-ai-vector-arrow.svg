<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" width="600" height="540" role="img" aria-labelledby="title"><title id="title">ベクトル [3,1] と [1,2] の和は [4,3]</title><defs><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176ba0"/></marker><marker id="dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#283530"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8faf9"/><g font-family="sans-serif" fill="#283530"><text x="28" y="38" font-size="22" font-weight="bold">ベクトルを足す：矢印をつなぐ</text><path d="M80 70V422" stroke="#d7e0dd"/><path d="M168 70V422" stroke="#d7e0dd"/><path d="M256 70V422" stroke="#d7e0dd"/><path d="M344 70V422" stroke="#d7e0dd"/><path d="M432 70V422" stroke="#d7e0dd"/><path d="M520 70V422" stroke="#d7e0dd"/><path d="M80 70H520" stroke="#d7e0dd"/><path d="M80 158H520" stroke="#d7e0dd"/><path d="M80 246H520" stroke="#d7e0dd"/><path d="M80 334H520" stroke="#d7e0dd"/><path d="M80 422H520" stroke="#d7e0dd"/><path d="M80 70V422H550" fill="none" stroke="#71817a"/><path d="M80 422L432 158" stroke="#60756c" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#dark)"/><path d="M80 422L344 334" stroke="#176ba0" stroke-width="4" marker-end="url(#blue)"/><path d="M344 334L432 158" stroke="#283530" stroke-width="4" marker-end="url(#dark)"/><text x="58" y="445" font-size="18">0</text><text x="180" y="451" font-size="22" fill="#176ba0">a = [3, 1]</text><text x="432" y="290" font-size="20">b = [1, 2]</text><text x="115" y="190" font-size="22">a + b = [4, 3]</text><text x="76" y="480" font-size="20">右へ3・上へ1 → 右へ1・上へ2</text><text x="76" y="513" font-size="20">合わせて、右へ4・上へ3</text></g></svg>