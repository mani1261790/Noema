<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 675" width="600" height="675" role="img" aria-labelledby="title"><title id="title">内積の符号：似た向きは正、直角はゼロ、反対向きは負</title><defs><marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#176ba0"/></marker><marker id="dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#283530"/></marker></defs><rect width="100%" height="100%" rx="12" fill="#f8faf9"/><g font-family="sans-serif" fill="#283530"><text x="24" y="38" font-size="22" font-weight="bold">矢印の向きと内積の符号</text><g transform="translate(0 55)"><path d="M24 0H576" stroke="#d7e0dd"/><g fill="none" stroke-width="4"><path d="M65 172L175 117" marker-end="url(#blue)" stroke="#176ba0"/><path d="M65 172L120 117" marker-end="url(#dark)" stroke="#283530"/></g><text x="215" y="70" font-size="23" font-weight="bold">似た向き：プラス</text><text x="215" y="115" font-size="21">[2, 1] · [1, 1] = 3</text></g><g transform="translate(0 260)"><path d="M24 0H576" stroke="#d7e0dd"/><g fill="none" stroke-width="4"><path d="M65 172H170" marker-end="url(#blue)" stroke="#176ba0"/><path d="M65 172V67" marker-end="url(#dark)" stroke="#283530"/><path d="M65 155H82V172" stroke="#71817a" stroke-width="2"/></g><text x="215" y="70" font-size="23" font-weight="bold">直角：ゼロ</text><text x="215" y="115" font-size="21">[1, 0] · [0, 1] = 0</text></g><g transform="translate(0 465)"><path d="M24 0H576" stroke="#d7e0dd"/><g fill="none" stroke-width="4"><path d="M115 132L170 77" marker-end="url(#blue)" stroke="#176ba0"/><path d="M115 132L60 187" marker-end="url(#dark)" stroke="#283530"/></g><text x="215" y="70" font-size="23" font-weight="bold">反対向き：マイナス</text><text x="215" y="115" font-size="21">[1, 1] · [−1, −1] = −2</text></g></g></svg>