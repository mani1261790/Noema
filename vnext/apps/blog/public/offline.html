<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#00645f">
  <meta name="robots" content="noindex">
  <title>接続を待っています | Noema</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 24px; background: #faf9f5; color: #173c38; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif; }
    main { max-width: 30rem; }
    svg { width: 64px; height: 64px; margin-bottom: 28px; }
    .brand { font-weight: 700; letter-spacing: .08em; color: #00645f; }
    h1 { font-size: clamp(24px, 5vw, 32px); line-height: 1.5; margin: 16px 0; }
    p { line-height: 1.9; }
    button { margin-top: 16px; border: 0; border-radius: 8px; background: #00645f; color: white; padding: 14px 24px; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 3px solid #00645f; outline-offset: 5px; }
    a { display: inline-block; margin: 24px 0 0 20px; color: #00645f; }
    .note { font-size: 14px; color: #526b65; margin-top: 28px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#00645f"/><path d="M18 47V17h7l14 20V17h7v30h-7L25 27v20Z" fill="#fffdf4"/></svg>
    <div class="brand">Noema</div>
    <h1>続きは、つながってから。</h1>
    <p>いまはネットワークに接続できません。<br>接続を確認して、もう一度お試しください。</p>
    <button type="button" onclick="location.reload()">もう一度読み込む</button>
    <a href="/">ホームへ</a>
    <p class="note">記事を読むにはインターネット接続が必要です。</p>
  </main>
</body>
</html>
