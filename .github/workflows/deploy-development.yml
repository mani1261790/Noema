name: Deploy Noema development preview to Cloudflare

on:
  push:
    branches: [develop]
    paths:
      - "vnext/**"
      - ".github/workflows/deploy-development.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-noema-development
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_PUBLIC_SITE_URL: https://noema-learn.mani1261790.workers.dev
      NOEMA_PREVIEW_CONTENT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vnext/package-lock.json

      - name: Install dependencies
        working-directory: vnext
        run: npm ci

      - name: Audit dependencies
        working-directory: vnext
        run: npm audit --audit-level=high

      - name: Test current application
        working-directory: vnext
        run: npm test

      - name: Validate current application
        working-directory: vnext
        run: npm run check

      - name: Build current application
        working-directory: vnext
        run: npm run build

      - name: Validate deployment packages
        working-directory: vnext
        run: npm run deploy:dry-run

      - name: Apply CMS database migrations
        working-directory: vnext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler d1 migrations apply noema-cms
          --remote
          --config apps/studio/wrangler.jsonc

      - name: Deploy blog Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: vnext/apps/blog
          wranglerVersion: "4.126.0"
          command: deploy --config dist/server/wrangler.json

      - name: Deploy Studio Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: vnext/apps/studio
          wranglerVersion: "4.126.0"
          secrets: |
            BETTER_AUTH_SECRET
          command: deploy --config wrangler.jsonc
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      - name: Deploy Studio MCP Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: vnext/apps/studio-mcp
          wranglerVersion: "4.126.0"
          command: deploy --config wrangler.jsonc

      - name: Verify development CMS publications
        working-directory: vnext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          npx wrangler d1 execute noema-cms \
            --remote \
            --config apps/studio/wrangler.jsonc \
            --command "SELECT a.published_slug FROM cms_articles a JOIN cms_article_revisions r ON r.id = a.published_revision_id WHERE a.publication_status = 'published' AND a.published_visibility = 'public' ORDER BY a.published_at DESC, a.id ASC" \
            --json > /tmp/noema-cms-publications.json
          curl --fail-with-body --silent --show-error --max-time 20 \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --output /tmp/noema-development-articles.html \
            https://noema-learn.mani1261790.workers.dev/articles
          node apps/blog/scripts/verify-cms-publication-parity.mjs \
            /tmp/noema-cms-publications.json \
            development=/tmp/noema-development-articles.html

          for attempt in $(seq 1 12); do
            redirect_result="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code} %{redirect_url}' https://noema-learn.mani1261790.workers.dev/articles/ || true)"
            if [[ "${redirect_result}" == "301 https://noema-learn.mani1261790.workers.dev/articles" ]]; then
              echo "Verified dynamic trailing-slash redirect (attempt ${attempt})."
              break
            fi
            if [[ "${attempt}" == "12" ]]; then
              echo "Expected /articles/ to redirect permanently to /articles, received ${redirect_result:-no response}." >&2
              exit 1
            fi
            sleep 5
          done
          node apps/blog/scripts/verify-article-image-dimensions.mjs \
            https://noema-learn.mani1261790.workers.dev
          npm run verify:public-seo --workspace @noema/blog -- \
            https://noema-learn.mani1261790.workers.dev
