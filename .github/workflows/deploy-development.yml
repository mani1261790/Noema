name: Deploy Noema development preview to Cloudflare

on:
  push:
    branches: [develop]
    paths:
      - "vnext/**"
      - ".github/workflows/deploy-development.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-noema-development
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: development
      url: https://noema-learn.mani1261790.workers.dev
    env:
      VITE_PUBLIC_SITE_URL: https://noema-learn.mani1261790.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vnext/package-lock.json

      - name: Install dependencies
        working-directory: vnext
        run: npm ci

      - name: Validate current application
        working-directory: vnext
        run: npm run check

      - name: Build current application
        working-directory: vnext
        run: npm run build

      - name: Keep public hostname closed
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: vnext/apps/public-gate
          wranglerVersion: "4.110.0"
          command: deploy --config wrangler.jsonc

      - name: Deploy blog Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: vnext/apps/blog
          wranglerVersion: "4.110.0"
          command: deploy --config dist/server/wrangler.json

      - name: Deploy Studio Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: vnext/apps/studio
          wranglerVersion: "4.110.0"
          command: deploy --config wrangler.jsonc
