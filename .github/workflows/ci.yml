name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vnext-checks:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_SITE_URL: https://noema-learn.mani1261790.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vnext/package-lock.json

      - name: Install current application dependencies
        working-directory: vnext
        run: npm ci

      - name: Audit dependencies
        working-directory: vnext
        run: npm audit --audit-level=high

      - name: Test current application
        working-directory: vnext
        run: npm test

      - name: Validate current application
        working-directory: vnext
        run: npm run check

      - name: Verify Cloudflare deployment bundles
        working-directory: vnext
        run: npm run deploy:dry-run
