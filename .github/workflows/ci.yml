name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vnext-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vnext/package-lock.json

      - name: Install current application dependencies
        working-directory: vnext
        run: npm ci

      - name: Audit dependencies
        working-directory: vnext
        run: npm audit --audit-level=high

      - name: Validate current application
        working-directory: vnext
        run: npm run check

      - name: Verify Cloudflare deployment bundles
        working-directory: vnext
        run: npm run deploy:dry-run
