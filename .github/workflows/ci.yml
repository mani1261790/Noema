name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  vnext-checks:
    runs-on: ubuntu-latest
    env:
      VITE_PUBLIC_SITE_URL: https://noema-learn.mani1261790.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: vnext/pnpm-lock.yaml

      - name: Install current application dependencies
        working-directory: vnext
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        working-directory: vnext
        run: pnpm audit --audit-level=high

      - name: Test current application
        working-directory: vnext
        run: pnpm test

      - name: Validate current application
        working-directory: vnext
        run: pnpm run check

      - name: Verify Cloudflare deployment bundles
        working-directory: vnext
        run: pnpm run deploy:dry-run
