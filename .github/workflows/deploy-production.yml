name: Deploy Noema production to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "vnext/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-noema-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_PUBLIC_SITE_URL: https://noema-learn.uk
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vnext/package-lock.json

      - name: Install dependencies
        working-directory: vnext
        run: npm ci

      - name: Test current application
        working-directory: vnext
        run: npm test

      - name: Validate current application
        working-directory: vnext
        run: npm run check

      - name: Build current application
        working-directory: vnext
        run: npm run build

      - name: Apply CMS database migrations
        working-directory: vnext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler d1 migrations apply noema-cms
          --remote
          --config apps/studio/wrangler.jsonc

      - name: Deploy production blog Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: vnext/apps/blog
          wranglerVersion: "4.126.0"
          command: >-
            deploy --config dist/server/wrangler.json
            --name noema-learn-production

      - name: Promote production blog route
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          api="https://api.cloudflare.com/client/v4"
          zone_name="noema-learn.uk"
          route_pattern="noema-learn.uk/*"
          production_worker="noema-learn-production"
          gate_worker="noema-public-gate"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          zone_response="$(curl --fail-with-body --silent --show-error \
            --header "${auth_header}" \
            "${api}/zones?name=${zone_name}")"
          zone_id="$(jq --exit-status --raw-output \
            --arg name "${zone_name}" \
            '.result | map(select(.name == $name)) | if length == 1 then .[0].id else error("expected exactly one zone") end' \
            <<<"${zone_response}")"

          routes_response="$(curl --fail-with-body --silent --show-error \
            --header "${auth_header}" \
            "${api}/zones/${zone_id}/workers/routes")"
          route_count="$(jq --raw-output \
            --arg pattern "${route_pattern}" \
            '[.result[] | select(.pattern == $pattern)] | length' \
            <<<"${routes_response}")"
          if [[ "${route_count}" -gt 1 ]]; then
            echo "Multiple routes match ${route_pattern}; refusing to choose one." >&2
            exit 1
          fi

          route_id="$(jq --raw-output \
            --arg pattern "${route_pattern}" \
            '.result[] | select(.pattern == $pattern) | .id' \
            <<<"${routes_response}")"
          current_worker="$(jq --raw-output \
            --arg pattern "${route_pattern}" \
            '.result[] | select(.pattern == $pattern) | .script // ""' \
            <<<"${routes_response}")"
          if [[ -n "${route_id}" && "${current_worker}" != "${gate_worker}" && "${current_worker}" != "${production_worker}" ]]; then
            echo "${route_pattern} belongs to unexpected Worker ${current_worker}; refusing to replace it." >&2
            exit 1
          fi

          payload="$(jq --null-input --compact-output \
            --arg pattern "${route_pattern}" \
            --arg script "${production_worker}" \
            '{pattern: $pattern, script: $script}')"
          if [[ -n "${route_id}" ]]; then
            route_response="$(curl --fail-with-body --silent --show-error \
              --request PUT \
              --header "${auth_header}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "${api}/zones/${zone_id}/workers/routes/${route_id}")"
          else
            route_response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "${auth_header}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "${api}/zones/${zone_id}/workers/routes")"
          fi
          jq --exit-status '.success == true' <<<"${route_response}" >/dev/null

      - name: Deploy Studio Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: vnext/apps/studio
          wranglerVersion: "4.126.0"
          secrets: |
            BETTER_AUTH_SECRET
          command: deploy --config wrangler.jsonc
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      - name: Deploy Studio MCP Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: vnext/apps/studio-mcp
          wranglerVersion: "4.126.0"
          command: deploy --config wrangler.jsonc

      - name: Verify production endpoints
        shell: bash
        run: |
          set -euo pipefail

          home_status="$(curl --silent --show-error --output /tmp/noema-home.html --write-out '%{http_code}' --retry 8 --retry-all-errors --retry-delay 5 https://noema-learn.uk/)"
          test "$home_status" = "200"
          grep -Fq '<link rel="canonical" href="https://noema-learn.uk/"' /tmp/noema-home.html

          robots_status="$(curl --silent --show-error --output /tmp/noema-robots.txt --write-out '%{http_code}' --retry 8 --retry-all-errors --retry-delay 5 https://noema-learn.uk/robots.txt)"
          test "$robots_status" = "200"
          grep -Fq 'Allow: /' /tmp/noema-robots.txt
          grep -Fq 'Sitemap: https://noema-learn.uk/sitemap.xml' /tmp/noema-robots.txt

          curl --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 https://noema-learn.mani1261790.workers.dev/articles/ > /tmp/noema-development-articles.html
          curl --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 https://noema-learn.uk/articles/ > /tmp/noema-production-articles.html
          { grep -oE 'href="/articles/[^"#?]+' /tmp/noema-development-articles.html || true; } | sort -u > /tmp/noema-development-article-paths.txt
          { grep -oE 'href="/articles/[^"#?]+' /tmp/noema-production-articles.html || true; } | sort -u > /tmp/noema-production-article-paths.txt
          diff -u /tmp/noema-development-article-paths.txt /tmp/noema-production-article-paths.txt

          while IFS= read -r article_href; do
            article_path="${article_href#href=\"}"
            test -z "$article_path" && continue
            article_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 8 --retry-all-errors --retry-delay 5 "https://noema-learn.uk${article_path}")"
            test "$article_status" = "200"
          done < /tmp/noema-production-article-paths.txt

          privacy_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 8 --retry-all-errors --retry-delay 5 https://noema-learn.uk/privacy/)"
          test "$privacy_status" = "200"

          studio_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://studio.noema-learn.uk/)"
          test "$studio_status" = "302"

          mcp_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://mcp.noema-learn.uk/mcp)"
          test "$mcp_status" = "401"
