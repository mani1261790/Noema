name: Deploy Noema production to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - "vnext/**"
      - ".github/workflows/deploy-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-noema-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_PUBLIC_SITE_URL: https://noema-learn.uk
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vnext/package-lock.json

      - name: Install dependencies
        working-directory: vnext
        run: npm ci

      - name: Test current application
        working-directory: vnext
        run: npm test

      - name: Validate current application
        working-directory: vnext
        run: npm run check

      - name: Build current application
        working-directory: vnext
        run: npm run build

      - name: Apply CMS database migrations
        working-directory: vnext
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx wrangler d1 migrations apply noema-cms
          --remote
          --config apps/studio/wrangler.jsonc

      - name: Deploy production blog Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: vnext/apps/blog
          wranglerVersion: "4.126.0"
          command: >-
            deploy --config dist/server/wrangler.json
            --name noema-learn-production

      - name: Promote production blog route
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          api="https://api.cloudflare.com/client/v4"
          zone_name="noema-learn.uk"
          route_pattern="noema-learn.uk/*"
          production_worker="noema-learn-production"
          gate_worker="noema-public-gate"
          auth_header="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"

          zone_response="$(curl --fail-with-body --silent --show-error \
            --header "${auth_header}" \
            "${api}/zones?name=${zone_name}")"
          zone_id="$(jq --exit-status --raw-output \
            --arg name "${zone_name}" \
            '.result | map(select(.name == $name)) | if length == 1 then .[0].id else error("expected exactly one zone") end' \
            <<<"${zone_response}")"

          routes_response="$(curl --fail-with-body --silent --show-error \
            --header "${auth_header}" \
            "${api}/zones/${zone_id}/workers/routes")"
          route_count="$(jq --raw-output \
            --arg pattern "${route_pattern}" \
            '[.result[] | select(.pattern == $pattern)] | length' \
            <<<"${routes_response}")"
          if [[ "${route_count}" -gt 1 ]]; then
            echo "Multiple routes match ${route_pattern}; refusing to choose one." >&2
            exit 1
          fi

          route_id="$(jq --raw-output \
            --arg pattern "${route_pattern}" \
            '.result[] | select(.pattern == $pattern) | .id' \
            <<<"${routes_response}")"
          current_worker="$(jq --raw-output \
            --arg pattern "${route_pattern}" \
            '.result[] | select(.pattern == $pattern) | .script // ""' \
            <<<"${routes_response}")"
          if [[ -n "${route_id}" && "${current_worker}" != "${gate_worker}" && "${current_worker}" != "${production_worker}" ]]; then
            echo "${route_pattern} belongs to unexpected Worker ${current_worker}; refusing to replace it." >&2
            exit 1
          fi

          payload="$(jq --null-input --compact-output \
            --arg pattern "${route_pattern}" \
            --arg script "${production_worker}" \
            '{pattern: $pattern, script: $script}')"
          if [[ -n "${route_id}" ]]; then
            route_response="$(curl --fail-with-body --silent --show-error \
              --request PUT \
              --header "${auth_header}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "${api}/zones/${zone_id}/workers/routes/${route_id}")"
          else
            route_response="$(curl --fail-with-body --silent --show-error \
              --request POST \
              --header "${auth_header}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "${api}/zones/${zone_id}/workers/routes")"
          fi
          jq --exit-status '.success == true' <<<"${route_response}" >/dev/null

      - name: Deploy Studio Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: vnext/apps/studio
          wranglerVersion: "4.126.0"
          secrets: |
            BETTER_AUTH_SECRET
          command: deploy --config wrangler.jsonc
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

      - name: Deploy Studio MCP Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: vnext/apps/studio-mcp
          wranglerVersion: "4.126.0"
          command: deploy --config wrangler.jsonc

      - name: Verify production endpoints
        shell: bash
        run: |
          set -euo pipefail

          fetch_expected() {
            local url="$1"
            local expected_status="$2"
            local output="$3"
            local expected_text="${4:-}"
            local attempt status

            for attempt in $(seq 1 12); do
              status="$(curl --silent --show-error --max-time 20 --output "${output}" --write-out '%{http_code}' "${url}" || true)"
              if [[ "${status}" == "${expected_status}" ]] && { [[ -z "${expected_text}" ]] || grep -Fq "${expected_text}" "${output}"; }; then
                echo "Verified ${url}: ${status} (attempt ${attempt})."
                return 0
              fi
              echo "Waiting for ${url}: expected ${expected_status}, received ${status:-no response} (attempt ${attempt}/12)." >&2
              if [[ "${attempt}" -lt 12 ]]; then
                sleep 5
              fi
            done
            return 1
          }

          verify_custom_domain_boundary() {
            local url="$1"
            local expected_status="$2"
            local status

            status="$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "${url}" || true)"
            if [[ "${status}" == "${expected_status}" ]]; then
              echo "Verified ${url}: ${status}."
              return 0
            fi
            if [[ "${status}" == "403" ]]; then
              echo "${url} returned the Cloudflare edge boundary 403 to the GitHub-hosted runner."
              return 0
            fi
            echo "${url} returned unexpected status ${status:-no response}; expected ${expected_status} or edge boundary 403." >&2
            return 1
          }

          production_origin="https://noema-learn-production.mani1261790.workers.dev"
          public_status="$(curl --silent --show-error --max-time 20 --output /tmp/noema-public-home.html --write-out '%{http_code}' https://noema-learn.uk/ || true)"
          case "${public_status}" in
            200)
              grep -Fq '<link rel="canonical" href="https://noema-learn.uk/"' /tmp/noema-public-home.html
              echo "Verified public hostname from the GitHub runner: 200."
              ;;
            403)
              echo "Public hostname returned 403 to the GitHub-hosted runner; continuing through the verified Worker Route and production origin."
              ;;
            *)
              echo "Public hostname returned unexpected status ${public_status:-no response}." >&2
              exit 1
              ;;
          esac

          fetch_expected "${production_origin}/" 200 /tmp/noema-home.html '<link rel="canonical" href="https://noema-learn.uk/"'
          fetch_expected "${production_origin}/robots.txt" 200 /tmp/noema-robots.txt
          grep -Fq 'Allow: /' /tmp/noema-robots.txt
          grep -Fq 'Sitemap: https://noema-learn.uk/sitemap.xml' /tmp/noema-robots.txt

          fetch_expected https://noema-learn.mani1261790.workers.dev/articles/ 200 /tmp/noema-development-articles.html
          fetch_expected "${production_origin}/articles/" 200 /tmp/noema-production-articles.html
          { grep -oE 'href="/articles/[^"#?]+' /tmp/noema-development-articles.html || true; } | sort -u > /tmp/noema-development-article-paths.txt
          { grep -oE 'href="/articles/[^"#?]+' /tmp/noema-production-articles.html || true; } | sort -u > /tmp/noema-production-article-paths.txt
          diff -u /tmp/noema-development-article-paths.txt /tmp/noema-production-article-paths.txt

          while IFS= read -r article_href; do
            article_path="${article_href#href=\"}"
            test -z "$article_path" && continue
            fetch_expected "${production_origin}${article_path}" 200 /dev/null
          done < /tmp/noema-production-article-paths.txt

          fetch_expected "${production_origin}/privacy/" 200 /dev/null
          verify_custom_domain_boundary https://studio.noema-learn.uk/ 302
          verify_custom_domain_boundary https://mcp.noema-learn.uk/mcp 401
